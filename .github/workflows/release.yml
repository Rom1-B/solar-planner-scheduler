name: Release

# Fires once per completion of any of the three required workflows (not just push), so it
# re-checks every time one of them finishes — see the "all green" loop below for why this is safe.
on:
  workflow_run:
    workflows: ["Tests", "Hassfest", "HACS"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Wait until Tests, Hassfest and HACS are all green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          for NAME in "Tests" "Hassfest" "HACS"; do
            CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=100" \
              --jq --arg n "$NAME" '[.workflow_runs[] | select(.name==$n)] | sort_by(.run_number) | last | .conclusion // "missing"')
            echo "$NAME: $CONCLUSION"
            if [ "$CONCLUSION" != "success" ]; then
              echo "Not all required workflows are green yet for $SHA — skipping for now, another trigger will re-check."
              exit 0
            fi
          done

      - name: Create a GitHub release if manifest.json's version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version custom_components/solar_planner_scheduler/manifest.json)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping."
            exit 0
          fi
          gh release create "$VERSION" --title "$VERSION" --generate-notes --target "${{ github.event.workflow_run.head_sha }}"
