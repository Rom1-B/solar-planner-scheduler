name: Release

# Triggered by the tag push itself (created by ci.yml's tag_release job once CI is green and
# manifest.json's version is new), not by polling CI's status — so this only ever runs when
# there's actually a release to create, never on ordinary commits.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --target "${{ github.sha }}"
