name: Release

# A single workflow's "completed" event fires exactly once per push, and its conclusion already
# aggregates every job in it (python, javascript, hassfest, hacs — see ci.yml) — no need to poll
# several separate workflows' status.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create a GitHub release if manifest.json's version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version custom_components/solar_planner_scheduler/manifest.json)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping."
            exit 0
          fi
          gh release create "$VERSION" --title "$VERSION" --generate-notes --target "${{ github.event.workflow_run.head_sha }}"
