name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions: {}

jobs:
  python:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: |
          printf "## Python coverage\n\n" >> "$GITHUB_STEP_SUMMARY"
          pytest tests/ --cov=custom_components/solar_planner_scheduler --cov-report=term \
            --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY" --cov-report=json:coverage.json
      - id: coverage
        run: echo "pct=$(jq -r .totals.percent_covered_display coverage.json)" >> "$GITHUB_OUTPUT"

  javascript:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      coverage: ${{ steps.coverage.outputs.pct }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: >-
          node --test --experimental-test-coverage --test-coverage-exclude='tests/**'
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
        working-directory: frontend
      - id: coverage
        working-directory: frontend
        run: |
          awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} /^BRF:/{bf+=$2} /^BRH:/{bh+=$2} /^FNF:/{ff+=$2} /^FNH:/{fh+=$2}
            END{printf "%d %.1f %.1f %.1f\n", lh*100/lf+0.5, lh*100/lf, bh*100/bf, fh*100/ff}' lcov.info \
            | { read -r pct lines branches funcs
                echo "pct=$pct" >> "$GITHUB_OUTPUT"
                printf '\n## JS coverage\n\n| Lines | Branches | Functions |\n|---|---|---|\n| %s%% | %s%% | %s%% |\n' \
                  "$lines" "$branches" "$funcs" >> "$GITHUB_STEP_SUMMARY"; }

  badges:
    needs: [python, javascript]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: badges
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Publish coverage badges to the badges branch
        env:
          PYTHON_PCT: ${{ needs.python.outputs.coverage }}
          JS_PCT: ${{ needs.javascript.outputs.coverage }}
        run: |
          if git fetch --depth=1 origin badges:refs/remotes/origin/badges; then
            git switch -c badges origin/badges
          else
            git switch --orphan badges
          fi
          badge() {
            local color=red
            if [ "$3" -ge 90 ]; then color=brightgreen
            elif [ "$3" -ge 80 ]; then color=green
            elif [ "$3" -ge 70 ]; then color=yellowgreen
            elif [ "$3" -ge 60 ]; then color=yellow
            elif [ "$3" -ge 50 ]; then color=orange
            fi
            printf '{"schemaVersion":1,"label":"%s","message":"%s%%","color":"%s"}\n' "$2" "$3" "$color" > "$1"
          }
          badge coverage-python.json "coverage python" "$PYTHON_PCT"
          badge coverage-js.json "coverage js" "$JS_PCT"
          git add coverage-python.json coverage-js.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update coverage badges"
          git push origin badges

  hassfest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  release:
    needs: [python, javascript, hassfest, hacs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for a new version
        id: version
        run: |
          VERSION=$(jq -r .version custom_components/solar_planner_scheduler/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the release
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Generate release notes with git-cliff
        if: steps.version.outputs.new == 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        id: cliff
        with:
          config: cliff.toml
          args: --tag ${{ steps.version.outputs.version }} --latest

      - name: Create the GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, never inlined in the script: commit messages could break or inject shell.
          NOTES: ${{ steps.cliff.outputs.content }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')

          {
            printf '%s\n' "$NOTES"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV_TAG...$VERSION"
            fi
          } > /tmp/release-notes.md

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes-file /tmp/release-notes.md \
            --target "$GITHUB_SHA"
