name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  python:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check pvlib version matches between requirements-dev.txt and manifest.json
        run: |
          DEV_VERSION=$(grep -oP '(?<=^pvlib==)\S+' requirements-dev.txt)
          MANIFEST_VERSION=$(jq -r '.requirements[] | select(startswith("pvlib=="))' custom_components/solar_planner_scheduler/manifest.json | cut -d= -f3)
          if [ "$DEV_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::pvlib version mismatch: requirements-dev.txt has $DEV_VERSION, manifest.json has $MANIFEST_VERSION. Dependabot only updates requirements-dev.txt, bump manifest.json's requirements to match by hand."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/

  javascript:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - run: node --test
        working-directory: frontend

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  release:
    needs: [python, javascript, hassfest, hacs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for a new version
        id: version
        run: |
          VERSION=$(jq -r .version custom_components/solar_planner_scheduler/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, skipping."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the release
        if: steps.version.outputs.new == 'true'
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Generate release notes with git-cliff
        if: steps.version.outputs.new == 'true'
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --tag ${{ steps.version.outputs.version }} --latest

      - name: Create the GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')

          {
            echo "${{ steps.cliff.outputs.content }}"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...$VERSION"
            fi
          } > /tmp/release-notes.md

          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --notes-file /tmp/release-notes.md \
            --target "${{ github.sha }}"
