[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501", # line length: this codebase writes dense, information-packed lines on purpose
    "B905", # zip() without strict=: every use here is an intentional pairwise zip(x, x[1:])
    "B023", # loop-variable closures: every flagged closure is called within the same iteration
]
