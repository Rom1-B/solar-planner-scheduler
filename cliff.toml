[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits -%}
{%- if group == "Features" -%}
- {{ commit.message | trim_start_matches(pat="Feat: ") | trim_start_matches(pat="feat: ") | upper_first }}
{% elif group == "Fixes" -%}
- {{ commit.message | trim_start_matches(pat="Fix: ") | trim_start_matches(pat="fix: ") | upper_first }}
{% else -%}
- {{ commit.message }}
{% endif -%}
{% endfor %}
{% endfor %}\
"""
footer = ""
trim = true
render_always = true

[git]
conventional_commits = false
filter_unconventional = false
filter_commits = false
tag_pattern = "[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  { message = "(?i)^feat:?\\s*", group = "Features" },
  { message = "(?i)^fix:?\\s*", group = "Fixes" },
  { message = ".*", group = "Other" },
]
